name: Compilar iOS (GymCopilot KMP)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout del proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Dar permisos de ejecucion a gradlew
        run: chmod +x gradlew

      - name: Compilar Framework KMP de iOS
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64

      - name: Subir artefacto KMP Framework
        uses: actions/upload-artifact@v4
        with:
          name: shared-framework-ios
          path: shared/build/bin/iosSimulatorArm64/debugFramework/

      - name: Compilar App de iOS (.app) para Appetize.io
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath iosApp/build
          cd iosApp/build/Build/Products/Debug-iphonesimulator
          zip -r ../../../../GymCopilot-Appetize.zip iosApp.app

      - name: Subir Paquete (.app.zip) para Appetize.io
        uses: actions/upload-artifact@v4
        with:
          name: GymCopilot-Appetize-iOS
          path: GymCopilot-Appetize.zip
