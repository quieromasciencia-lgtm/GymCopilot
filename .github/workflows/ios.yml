name: Compilar iOS (GymCopilot KMP)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout del proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Dar permisos de ejecucion a gradlew
        run: chmod +x gradlew

      - name: Compilar KMP Framework para Simulador (iosSimulatorArm64)
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64

      - name: Compilar KMP Framework para Dispositivo Real (iosArm64)
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64

      - name: Subir artefacto KMP Framework
        uses: actions/upload-artifact@v4
        with:
          name: shared-framework-ios
          path: shared/build/bin/iosSimulatorArm64/debugFramework/

      - name: Compilar App de iOS (.app) para Appetize.io
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug -sdk iphonesimulator -arch arm64 ONLY_ACTIVE_ARCH=YES -derivedDataPath iosApp/build-sim CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          cd iosApp/build-sim/Build/Products/Debug-iphonesimulator
          zip -r ../../../../GymCopilot-Appetize.zip iosApp.app

      - name: Subir Paquete (.app.zip) para Appetize.io
        uses: actions/upload-artifact@v4
        with:
          name: GymCopilot-Appetize-iOS
          path: GymCopilot-Appetize.zip

      - name: Generar Archivo Instalable iOS (.ipa)
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Release -sdk iphoneos -derivedDataPath iosApp/build-ipa CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          cd iosApp/build-ipa/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -r iosApp.app Payload/
          zip -r ../../../../GymCopilot-iOS.ipa Payload

      - name: Subir Archivo Instalable (.ipa)
        uses: actions/upload-artifact@v4
        with:
          name: GymCopilot-iOS-IPA
          path: GymCopilot-iOS.ipa
