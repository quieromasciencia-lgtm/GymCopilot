name: Desplegar GymCopilot PWA (Páginas de GitHub)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del proyecto
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Dar permisos de ejecucion a gradlew
        run: chmod +x gradlew

      - name: Compilar Distribución Web PWA (JS)
        run: ./gradlew :shared:jsBrowserDistribution :shared:jsBrowserProductionWebpack --no-daemon

      - name: Preparar carpeta de publicación PWA
        run: |
          mkdir -p pwa-out
          if [ -d "shared/build/dist/js/productionExecutable" ]; then
            cp -R shared/build/dist/js/productionExecutable/* pwa-out/ || true
          fi
          if [ -d "shared/build/kotlin-webpack/js/productionExecutable" ]; then
            cp -R shared/build/kotlin-webpack/js/productionExecutable/* pwa-out/ || true
          fi
          if [ -d "shared/src/jsMain/resources" ]; then
            cp -R shared/src/jsMain/resources/* pwa-out/ || true
          fi
          echo "==== Archivos en pwa-out/ ===="
          ls -la pwa-out/

      - name: Subir Artefactos para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: pwa-out/

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
